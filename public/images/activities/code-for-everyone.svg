    <circle cx="212" cy="165" r="5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
    <text x="182" y="248" fill="#EFA524">const</text>
    <text x="240" y="248" fill="#EEDEC1" fill-opacity=".8">future =</text>
    <text x="182" y="288" fill="#EEDEC1" fill-opacity=".8">  learn(</text>
