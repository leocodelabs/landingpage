      <stop offset="100%" stop-color="#EFA524" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#EEDEC1" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#202628"/>
